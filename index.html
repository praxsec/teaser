<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f4f0">
    <title>praxsec</title>
    <style>
      :root {
        color-scheme: light;
        background: #f5f4f0;
        color: #191a18;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      main {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        place-items: center;
        padding: 24px;
      }

      h1 {
        margin: 0;
        font-size: clamp(48px, 10vw, 112px);
        font-weight: 500;
        letter-spacing: -0.065em;
        line-height: 1.1;
      }

      ::selection {
        background: #191a18;
        color: #f5f4f0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>praxsec</h1>
    </main>
  </body>
</html>
